apiVersion: apps/v1
kind: Deployment
metadata:
  name: minha-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: minha-app
  template:
    metadata:
      labels:
        app: minha-app
    spec:
      containers:
      - name: minha-app
        image: minha-app:latest
        ports:
        - containerPort: 5000

